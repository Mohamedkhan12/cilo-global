<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cilo-Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#030b1e;--ink:#eaf3ff;--soft:#8fb4e8;--glow:#2f8bff;--ice:#7fd4ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.veil{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,var(--bg) 100%);pointer-events:none}
main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7vh 6vw;text-align:center;pointer-events:none}
.brand{font-weight:600;font-size:clamp(1.1rem,2.4vw,1.5rem);letter-spacing:.32em}
.brand i{font-style:normal;color:var(--ice)}
.mid{max-width:760px}
h1{font-weight:300;font-size:clamp(2rem,6.4vw,4.4rem);line-height:1.1;margin:0;letter-spacing:-.01em;min-height:2.3em;display:flex;align-items:center;justify-content:center;transition:opacity .7s,filter .7s,transform .7s}
h1.out{opacity:0;filter:blur(10px);transform:translateY(8px)}
p{color:var(--soft);font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.6;margin:1rem auto 0;max-width:46ch}
.status{display:flex;align-items:center;gap:.7rem;color:var(--soft);font-size:.9rem;padding:.65rem 1.2rem;border:1px solid rgba(127,212,255,.3);border-radius:999px;background:rgba(10,30,70,.45);backdrop-filter:blur(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ice);box-shadow:0 0 12px var(--glow);animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.25;transform:scale(.7)}}
.mail{display:inline-block;margin-top:1.4rem;color:var(--ice);font-size:clamp(1rem,2vw,1.2rem);text-decoration:none;padding:.55rem 1.3rem;border:1px solid rgba(127,212,255,.45);border-radius:999px;background:rgba(10,30,70,.5);backdrop-filter:blur(8px);pointer-events:auto;transition:background .2s,box-shadow .2s}
.mail:hover,.mail:focus-visible{background:rgba(47,139,255,.3);box-shadow:0 0 22px rgba(47,139,255,.55);outline:none}
.grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(47,139,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(47,139,255,.09) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
.br{position:fixed;width:34px;height:34px;border:2px solid rgba(127,212,255,.55);pointer-events:none}
.tl{top:max(18px,env(safe-area-inset-top));left:18px;border-right:0;border-bottom:0}
.tr{top:max(18px,env(safe-area-inset-top));right:18px;border-left:0;border-bottom:0}
.bl{bottom:max(18px,env(safe-area-inset-bottom));left:18px;border-right:0;border-top:0}
.brr{bottom:max(18px,env(safe-area-inset-bottom));right:18px;border-left:0;border-top:0}
.clock{position:fixed;top:max(26px,calc(env(safe-area-inset-top) + 8px));right:64px;font-size:.78rem;color:var(--soft);letter-spacing:.08em;font-variant-numeric:tabular-nums;pointer-events:none}
.clock b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff5a6e;margin-right:.5rem;animation:p 1.2s infinite}
.bottom{display:flex;flex-direction:column;align-items:center;gap:.9rem}
.term{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:.8rem;color:var(--ice);min-height:1.2em;opacity:.85}
.term::after{content:'_';animation:p 1s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.dot,.term::after,.clock b{animation:none}h1{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="grid"></div>
<div class="veil"></div>
<i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br brr"></i>
<div class="clock" aria-hidden="true"><b></b><span id="clk"></span></div>
<main>
  <div class="brand">CILO<i>·</i>GLOBAL</div>
  <div class="mid">
    <h1 id="line">Something big is taking shape</h1>
    <p>Our new website is on its way. Check back soon.</p>
    <a class="mail" href="mailto:contact@cilo-global.com">contact@cilo-global.com</a>
  </div>
  <div class="bottom">
    <div class="term" id="term" aria-hidden="true">booting interface…</div>
    <div class="status"><span class="dot"></span>Under construction</div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var lines=["Something big is taking shape","Our new site is being built","Almost ready to connect the world","Launching very soon","Good things are on the way"];
  var el=document.getElementById('line'),i=0;
  setInterval(function(){el.classList.add('out');setTimeout(function(){i=(i+1)%lines.length;el.textContent=lines[i];el.classList.remove('out')},700)},3600);

  var tl=["booting interface…","linking nodes…","securing connections…","syncing data streams…","compiling the final build…"],ti=0,te=document.getElementById('term');
  setInterval(function(){ti=(ti+1)%tl.length;te.textContent=tl[ti]},2600);
  var ck=document.getElementById('clk');
  function tick(){var d=new Date();ck.textContent=d.toLocaleTimeString('en-GB')}tick();setInterval(tick,1000);

  var canvas=document.getElementById('c');
  if(!window.THREE){return}
  var r=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2));
  var s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.z=7;
  var g=new THREE.Group();s.add(g);

  var core=new THREE.Mesh(new THREE.SphereGeometry(1.9,48,48),new THREE.MeshBasicMaterial({color:0x061a44,transparent:true,opacity:.85}));g.add(core);
  var wire=new THREE.Mesh(new THREE.IcosahedronGeometry(2.05,3),new THREE.MeshBasicMaterial({color:0x2f8bff,wireframe:true,transparent:true,opacity:.35}));g.add(wire);

  // glowing nodes on the globe
  var pts=[],N=260;
  for(var k=0;k<N;k++){var ph=Math.acos(1-2*(k+.5)/N),th=Math.PI*(1+Math.sqrt(5))*k;
    pts.push(new THREE.Vector3(2.1*Math.sin(ph)*Math.cos(th),2.1*Math.cos(ph),2.1*Math.sin(ph)*Math.sin(th)))}
  var pg=new THREE.BufferGeometry().setFromPoints(pts);
  g.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x7fd4ff,size:.045})));

  // arcs between random nodes
  var arcM=new THREE.LineBasicMaterial({color:0x7fd4ff,transparent:true,opacity:.35}),curves=[];
  for(var a=0;a<14;a++){
    var p1=pts[Math.random()*N|0],p2=pts[Math.random()*N|0];
    var mid=p1.clone().add(p2).multiplyScalar(.5).normalize().multiplyScalar(2.1+p1.distanceTo(p2)*.28);
    var cv=new THREE.QuadraticBezierCurve3(p1,mid,p2);curves.push(cv);
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cv.getPoints(40)),arcM));
  }

  // orbit rings
  var rings=[];
  [[2.8,.012,1.2,0],[3.3,.008,.5,.8],[3.8,.006,-.6,-.5]].forEach(function(d){
    var m=new THREE.Mesh(new THREE.TorusGeometry(d[0],d[1],8,160),new THREE.MeshBasicMaterial({color:0x4aa3ff,transparent:true,opacity:.55}));
    m.rotation.x=d[2];m.rotation.y=d[3];s.add(m);rings.push(m);
  });

  // data packets travelling along the arcs
  var pk=[],pkG=new THREE.SphereGeometry(.045,8,8),pkM=new THREE.MeshBasicMaterial({color:0xffffff});
  curves.forEach(function(c){var m=new THREE.Mesh(pkG,pkM);m.userData={c:c,o:Math.random(),sp:.003+Math.random()*.004};g.add(m);pk.push(m)});

  // starfield
  var sp=new Float32Array(900*3);
  for(var j=0;j<sp.length;j++)sp[j]=(Math.random()-.5)*40;
  var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  var stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xaed6ff,size:.05,transparent:true,opacity:.7}));s.add(stars);

  var mx=0,my=0;
  addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  function size(){var w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.position.z=w<700?9:7;cam.updateProjectionMatrix()}
  addEventListener('resize',size);size();

  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,t=0;
  function loop(){
    t+=reduce?0:.004;
    g.rotation.y=t;g.rotation.x+=((my*.5)-g.rotation.x)*.04;
    wire.rotation.y=-t*.6;
    rings.forEach(function(m,n){m.rotation.z=t*(n%2?-1:1)*(1+n*.4)});
    stars.rotation.y=t*.15;
    pk.forEach(function(m){var d=m.userData;d.o=(d.o+(reduce?0:d.sp))%1;m.position.copy(d.c.getPoint(d.o))});
    cam.position.x+=((mx*1.2)-cam.position.x)*.04;cam.lookAt(0,0,0);
    r.render(s,cam);requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
